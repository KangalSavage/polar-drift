workflows:
  ios-workflow:
    name: Tilt Merge - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Must match the reference name given to the App Store Connect API key
      # integration in Codemagic: Team settings -> Integrations -> App Store Connect.
      # TODO: confirm which integration name covers this app - reused the same one
      # Orbit Dash uses ("Echo Trail: Dodge"), but verify in the Codemagic dashboard
      # before the first run; a wrong name fails at the signing-files step.
      app_store_connect: "Echo Trail: Dodge"
    environment:
      groups:
        # Must contain CERTIFICATE_PRIVATE_KEY (secret) - see Codemagic Team/App
        # Environment variables. Used to encrypt a freshly auto-generated
        # distribution certificate's private key; not an Apple credential itself.
        - code_signing
      vars:
        BUNDLE_ID: "com.sparkform.tiltmerge"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Build web bundle
        script: npm run build
      - name: Sync web assets into the iOS project
        script: npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Set up keychain to be used for codesigning
        script: keychain initialize
      - name: Fetch signing files (creates an App Store profile if none exists yet)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Set build number from App Store Connect
        script: |
          #!/usr/bin/env bash
          set -e
          # App Store Connect rejects re-uploading a build number that was ever used before
          # for this app (any track, not just the version being submitted to). Look up the
          # app's numeric Apple ID from its bundle id, then the highest build number it has
          # ever seen, and go one above that - so every build is uploadable without manual
          # bumping. Falls back to 0 (-> build 1) the very first time, before any upload exists.
          APP_ID=$(app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json | jq -r '.[0].id')
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number --platform IOS "$APP_ID" 2>/dev/null || echo 0)
          echo "BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))" >> $CM_ENV
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
