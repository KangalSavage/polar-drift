<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#05060f" />
  <title>Polar Drift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>

    <!-- MAIN MENU -->
    <section id="menu-screen" class="screen active">
      <div class="badge-stack">
        <div class="best-badge">
          <span class="best-badge-icon">★</span>
          <span id="menu-best-score">0</span>
        </div>
        <div class="best-badge coin-badge">
          <span class="best-badge-icon">🪙</span>
          <span id="menu-coins">0</span>
        </div>
      </div>

      <button id="mute-btn" class="mute-btn" aria-label="Toggle sound">
        <span id="mute-icon">🔊</span>
      </button>

      <div class="top-group">
        <div class="logo-wrap">
          <div class="logo-orb">
            <span class="logo-orb-core"></span>
          </div>
          <h1 class="title">POLAR<br />DRIFT</h1>
        </div>
        <span class="hyper-badge">TAP TO FLIP</span>
      </div>

      <div class="how-to-play" aria-hidden="true">
        <div class="rule-row rule-safe">
          <span class="rule-chip rule-chip-red"></span>
          <span class="rule-symbol">=</span>
          <span class="rule-chip rule-chip-red rule-chip-wall"></span>
          <span class="rule-arrow rule-arrow-safe">↩</span>
          <span class="rule-label rule-label-safe">SAFE</span>
        </div>
        <div class="rule-row rule-danger">
          <span class="rule-chip rule-chip-red"></span>
          <span class="rule-symbol">≠</span>
          <span class="rule-chip rule-chip-blue rule-chip-wall"></span>
          <span class="rule-arrow rule-arrow-danger">→✕</span>
          <span class="rule-label rule-label-danger">DANGER</span>
        </div>
      </div>

      <div class="bottom-group">
        <div id="theme-row" class="theme-row"></div>
        <button id="start-btn" class="btn btn-cta">PLAY</button>
      </div>
    </section>

    <!-- GAME SCREEN -->
    <section id="game-screen" class="screen">
      <div class="hud">
        <div class="hud-score">
          <span id="hud-shield" class="hud-shield hidden">🛡</span>
          <span id="hud-score" class="score-value">0</span>
        </div>
        <button id="pause-btn" class="icon-btn" aria-label="Pause">
          <span class="pause-icon"></span>
        </button>
      </div>

      <div id="gesture-hint" class="gesture-hint hidden" aria-hidden="true">
        <span class="gesture-hint-ring"></span>
        <span class="gesture-hint-ring gesture-hint-ring-delay"></span>
        <span class="gesture-hint-label">TAP ANYWHERE TO FLIP CHARGE</span>
      </div>

      <!-- PAUSE OVERLAY -->
      <div id="pause-overlay" class="overlay hidden">
        <div class="overlay-content">
          <h2>PAUSED</h2>
          <button id="resume-btn" class="btn btn-primary">RESUME</button>
          <button id="pause-menu-btn" class="btn btn-secondary">MAIN MENU</button>
        </div>
      </div>

      <!-- CONTINUE (watch-ad-to-revive) OVERLAY -->
      <div id="continue-overlay" class="overlay hidden">
        <div class="overlay-content">
          <h2 class="gameover-title">SHORTED OUT</h2>
          <div id="continue-timer" class="continue-timer">5</div>
          <button id="continue-btn" class="btn btn-primary">▶ WATCH AD TO CONTINUE</button>
          <button id="continue-skip-btn" class="btn btn-secondary">NO THANKS</button>
        </div>
      </div>
    </section>

    <!-- GAME OVER -->
    <section id="gameover-screen" class="screen">
      <div class="menu-content">
        <h1 class="title gameover-title">SHORTED OUT</h1>
        <div id="new-best-badge" class="new-best-badge hidden">NEW BEST!</div>

        <div class="score-summary">
          <div class="score-row">
            <span class="label">SCORE</span>
            <span id="final-score" class="value">0</span>
          </div>
          <div class="score-row">
            <span class="label">BEST</span>
            <span id="final-best-score" class="value">0</span>
          </div>
        </div>

        <div id="coins-earned-row" class="coins-earned-row hidden">
          <span class="best-badge-icon">🪙</span>
          <span>+<span id="coins-earned">0</span> COINS</span>
        </div>

        <button id="play-again-btn" class="btn btn-primary">PLAY AGAIN</button>
        <button id="gameover-menu-btn" class="btn btn-secondary">MAIN MENU</button>
      </div>
    </section>

  </div>

  <script src="js/bundle.js"></script>
</body>
</html>
